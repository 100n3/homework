<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Формы</title>
		<link rel="stylesheet" href="./css/style.css" />
	</head>
	<body>
		<form>
			<fieldset class="fieldset">
				<h2 class="hline">Ваши личные данные</h2>
				<label>
					<span>Ваше имя</span>
					<input
						class="input"
						type="text"
						name="name"
						required
						placeholder="Имя"
					/>
				</label>
				<label>
					<span>Ваш возраст</span>
					<input
						class="input"
						type="number"
						name="age"
						required
						placeholder="Возраст"
					/>
				</label>
				<label>
					<span>Ваш номер телефона</span>
					<input
						class="input"
						type="tel"
						name="phone"
						required
						placeholder="Номер телефона"
					/>
				</label>
				<label>
					<span>Ваша почта</span>
					<input
						class="input"
						type="email"
						name="gmail"
						required
						placeholder="Почта"
					/>
				</label>
				<label>
					<span>Сообщение</span>
					<textarea
						class="textarea"
						name="message"
						required
						placeholder="Ваше сообщение"
					></textarea>
				</label>
				<label>
					<input type="checkbox" required />
					Я принимаю правила
				</label>
				<button class="button">Отправить</button>
			</fieldset>
		</form>
	</body>
</html>
